server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: yeho-ai-platform
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yeho_ai_platform}
    username: ${SPRING_DATASOURCE_USERNAME:yeho}
    password: ${SPRING_DATASOURCE_PASSWORD:yeho_pass}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

yeho:
  security:
    token-ttl-hours: ${YEHO_SECURITY_TOKEN_TTL_HOURS:12}
    default-admin-password: ${YEHO_SECURITY_DEFAULT_ADMIN_PASSWORD:Admin@123456}
